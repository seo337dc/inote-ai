# 로컬 개발용 AI DB (Postgres + pgvector). 운영 AI DB(Supabase 별도 프로젝트)와 완전히 분리된 이 PC 안의 DB.
#
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d     # 시작 (처음 한 번은 schema.sql이 자동 적용됨)
#   docker compose -f docker-compose.dev.yml --env-file .env.dev down      # 정지 (데이터 유지)
#   docker compose -f docker-compose.dev.yml --env-file .env.dev down -v   # 정지 + DB 삭제(다시 만들면 schema.sql이 새로 적용됨)
#
# 연결: postgresql://ai:<AI_DEV_DB_PASSWORD>@127.0.0.1:5434/inote_ai_dev   (uvicorn을 이 DB로 띄울 때 DATABASE_URL로 덮어쓴다)
# --env-file .env.dev 를 쓰는 이유: 기본 .env에는 운영 DATABASE_URL 등이 있어서 개발 DB 비밀번호와 섞이지 않게 분리한다.
services:
  db:
    image: pgvector/pgvector:pg17
    # 이 PC 밖에서는 접근하지 못하게 localhost에만 연다 (5433은 inote-embedder 실험 DB가 쓴다)
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ${AI_DEV_DB_PASSWORD:?.env.dev에 AI_DEV_DB_PASSWORD를 채워 주세요 (openssl rand -hex 16)}
      POSTGRES_DB: inote_ai_dev
    volumes:
      - ai-dev-pgdata:/var/lib/postgresql/data
      # 처음 만들어질 때만 파일 이름 순서대로 실행된다. 이미 만든 DB에 schema.sql을 다시 적용하려면 README의 "스키마 다시 적용" 참고.
      - ./docker/dev-db-init.sql:/docker-entrypoint-initdb.d/01-dev-init.sql:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro

volumes:
  ai-dev-pgdata:
